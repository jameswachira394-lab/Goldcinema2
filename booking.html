<div id="seat-container"></div>
<button id="confirm-btn">Confirm Booking</button>

<script>
const seats = [];
for (let row of ['A','B','C','D']) {
  for (let num=1; num<=10; num++) seats.push(`${row}${num}`);
}

const container = document.getElementById("seat-container");
const selectedSeats = new Set();
const movie = "Dune 2";
const showtime = "2025-10-12 20:00";
const user_id = 1;

async function fetchBookedSeats() {
  const res = await fetch(`http://localhost:4000/api/bookings/seats?movie=${movie}&showtime=${showtime}`);
  const booked = await res.json();

  container.innerHTML = "";
  seats.forEach(seat => {
    const btn = document.createElement("button");
    btn.textContent = seat;
    btn.className = `m-1 p-2 ${booked.includes(seat) ? 'bg-red-400' : 'bg-green-400'}`;
    btn.disabled = booked.includes(seat);

    btn.onclick = () => {
      if (selectedSeats.has(seat)) {
        selectedSeats.delete(seat);
        btn.classList.replace("bg-blue-400", "bg-green-400");
      } else {
        selectedSeats.add(seat);
        btn.classList.replace("bg-green-400", "bg-blue-400");
      }
    };
    container.appendChild(btn);
  });
}

document.getElementById("confirm-btn").onclick = async () => {
  for (const seat of selectedSeats) {
    await fetch("http://localhost:5000/api/bookings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id, movie, seat, showtime })
    });
  }
  alert("Booking confirmed!");
  fetchBookedSeats();
};

fetchBookedSeats();
</script>

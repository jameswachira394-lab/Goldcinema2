    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gold Cinema</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
    <!-- AUTH FORMS -->
    <div id="auth">
      <div id="login" class="auth-form" style="display:none;">
        <h2>Login</h2>
        <form onsubmit="handleLogin(event)">
          <label>Email / Username</label>
          <input id="login-username" required />
          <label>Password</label>
          <input id="login-password" type="password" required />
          <button type="submit">Login</button>
          <p>Don't have an account? <a href="#" onclick="showRegister();return false;">Register</a></p>
        </form>
      </div>
     
      <div id="register" class="auth-form" style="display:none;">
        <h2>Register</h2>
        <form onsubmit="handleRegister(event)">
          <label>Email</label><input id="reg-email" type="email" required />
          <label>Username</label><input id="reg-username" required />
          <label>Password</label><input id="reg-password" type="password" required />
          <label>Confirm Password</label><input id="reg-confirm" type="password" required />
          <button type="submit">Register</button>
        </form>
      </div>
    </div>
